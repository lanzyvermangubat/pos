<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>READY FOR PICKUP</title>
    <style>
        :root { --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { font-family: var(--font); background: #fff; color: #000; margin: 0; padding: 20px; }
        h1 { text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; font-weight: 800; }
        .ready-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .ready-card { border: 2px solid #000; padding: 20px; background: #fff; }
        .table-num { font-size: 3rem; font-weight: 900; border-bottom: 1px solid #000; margin-bottom: 10px; }
        .btn-delivered { width: 100%; padding: 15px; background: #000; color: #fff; border: none; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
    <h1>READY FOR PICKUP</h1>
    <div id="readyContainer" class="ready-grid"></div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4", authDomain: "pos-lovelyentclub.firebaseapp.com", databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com", projectId: "pos-lovelyentclub", storageBucket: "pos-lovelyentclub.firebasestorage.app", messagingSenderId: "271664805776", appId: "1:271664805776:web:38b2482645209cd7f56515" };
    const app = initializeApp(firebaseConfig); const db = getDatabase(app);
    onValue(ref(db, 'completedOrders'), (snapshot) => {
        const container = document.getElementById('readyContainer'); const data = snapshot.val(); container.innerHTML = ''; if (!data) return;
        Object.entries(data).forEach(([id, order]) => {
            const card = document.createElement('div'); card.className = 'ready-card';
            card.innerHTML = `<div class="table-num">${order.table}</div><div style="margin-bottom:15px; font-weight:600;">${order.items.join(', ')}</div><button class="btn-delivered" onclick="window.markDelivered('${id}')">DELIVERED</button>`;
            container.appendChild(card);
        });
    });
    window.markDelivered = (id) => remove(ref(db, `completedOrders/${id}`));
</script>
</body>
</html>
