<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPORTS - ANALYTICS</title>
    <style>
        :root { --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { font-family: var(--font); background: #f8f9fa; margin: 0; padding: 20px; color: #000; }
        .container { max-width: 1000px; margin: auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { font-weight: 800; margin: 0; letter-spacing: -1px; }

        /* Stats Section */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border: 1px solid #000; text-align: center; }
        .stat-value { font-size: 2.2rem; font-weight: 900; display: block; }
        .stat-label { color: #555; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }

        /* Efficiency & Labor Section */
        .analytics-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 30px; }
        .a-box { background: #000; color: #fff; padding: 20px; border: 1px solid #000; }
        .a-title { font-weight: 800; text-transform: uppercase; font-size: 0.8rem; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; display: block; }
        
        .labor-inputs { display: flex; gap: 10px; margin-bottom: 15px; }
        .labor-inputs input { background: #222; border: 1px solid #444; color: #fff; padding: 8px; width: 80px; font-family: inherit; }
        
        .hour-bar { display: flex; align-items: flex-end; gap: 4px; height: 100px; }
        .bar { background: #fff; flex: 1; min-width: 10px; position: relative; }

        table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #000; }
        th { background: #000; color: #fff; padding: 12px; text-align: left; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #ddd; font-weight: 600; font-size: 0.9rem; }
        
        .success { color: #2ecc71; } .fail { color: #e74c3c; }
        .reset-btn { background: #000; color: white; border: none; padding: 10px 15px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>SHIFT ANALYTICS</h1>
        <button class="reset-btn" onclick="window.resetDailyStats()">RESET DATA</button>
    </header>

    <div class="stats-row">
        <div class="stat-card"><span class="stat-value" id="totalOrders">0</span><span class="stat-label">Orders</span></div>
        <div class="stat-card"><span class="stat-value" id="avgCookTime">0m</span><span class="stat-label">Avg Cook</span></div>
        <div class="stat-card"><span class="stat-value" id="efficiency">0%</span><span class="stat-label">Success Rate</span></div>
        <div class="stat-card"><span class="stat-value" id="laborCost">--</span><span class="stat-label">Cost / Order</span></div>
    </div>

    <div class="analytics-grid">
        <div class="a-box">
            <span class="a-title">Peak Times (Orders per Hour)</span>
            <div class="hour-bar" id="hourHeatmap"></div>
        </div>
        <div class="a-box">
            <span class="a-title">Labor Settings</span>
            <div class="labor-inputs">
                <div><label style="font-size:0.6rem; display:block">STAFF ON</label><input type="number" id="staffCount" value="2" oninput="updateLabor()"></div>
                <div><label style="font-size:0.6rem; display:block">WAGE/HR</label><input type="number" id="hourlyWage" value="15" oninput="updateLabor()"></div>
            </div>
            <div id="topItems" style="font-weight: 700; border-top: 1px solid #333; padding-top: 10px;"></div>
        </div>
    </div>

    <table>
        <thead><tr><th>Table</th><th>Items</th><th>Wait</th><th>Finished</th></tr></thead>
        <tbody id="historyBody"></tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = { 
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4", 
        authDomain: "pos-lovelyentclub.firebaseapp.com", 
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com", 
        projectId: "pos-lovelyentclub", 
        storageBucket: "pos-lovelyentclub.firebasestorage.app", 
        messagingSenderId: "271664805776", 
        appId: "1:271664805776:web:38b2482645209cd7f56515" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const historyRef = ref(db, 'history');
    let cachedOrderCount = 0;

    onValue(historyRef, (snapshot) => {
        const data = snapshot.val();
        const tbody = document.getElementById('historyBody');
        const topList = document.getElementById('topItems');
        const heatmap = document.getElementById('hourHeatmap');
        
        tbody.innerHTML = ''; heatmap.innerHTML = '';
        if (!data) {
            ["totalOrders","avgCookTime","efficiency","totalItems"].forEach(id => { if(document.getElementById(id)) document.getElementById(id).innerText = "0"});
            topList.innerHTML = "No sales recorded.";
            cachedOrderCount = 0;
            updateLabor();
            return;
        }

        let totalWaitMinutes = 0, fastOrders = 0;
        const itemSales = {};
        const hourlyData = new Array(24).fill(0);
        const orders = Object.values(data).sort((a, b) => b.completedAt - a.completedAt);
        cachedOrderCount = orders.length;

        orders.forEach(order => {
            const cookTime = Math.round((order.completedAt - order.timestamp) / 60000);
            totalWaitMinutes += cookTime;
            if (cookTime <= 3) fastOrders++;
            const hour = new Date(order.completedAt).getHours();
            hourlyData[hour]++;
            order.items.forEach(i => {
                const name = i.split('x ')[1] || i;
                const qty = parseInt(i.split('x ')[0]) || 1;
                itemSales[name] = (itemSales[name] || 0) + qty;
            });
            const row = document.createElement('tr');
            row.innerHTML = `<td><strong>${order.table}</strong></td><td>${order.items.join(', ')}</td><td class="${cookTime > 3 ? 'fail' : 'success'}">${cookTime}m</td><td>${new Date(order.completedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>`;
            tbody.appendChild(row);
        });

        document.getElementById('totalOrders').innerText = orders.length;
        document.getElementById('avgCookTime').innerText = Math.round(totalWaitMinutes / orders.length) + 'm';
        document.getElementById('efficiency').innerText = Math.round((fastOrders / orders.length) * 100) + '%';
        const sortedItems = Object.entries(itemSales).sort((a, b) => b[1] - a[1]).slice(0, 3);
        topList.innerHTML = `<span style="font-size:0.7rem; color:#888">BESTSELLERS:</span><br>` + sortedItems.map((it, idx) => `#${idx+1} ${it[0]} (${it[1]})`).join(' | ');

        const maxOrders = Math.max(...hourlyData);
        hourlyData.forEach((count, hr) => {
            const h = count > 0 ? (count / maxOrders) * 100 : 2;
            heatmap.innerHTML += `<div class="bar" style="height:${h}%"></div>`;
        });
        updateLabor();
    });

    window.updateLabor = () => {
        const staff = document.getElementById('staffCount').value;
        const wage = document.getElementById('hourlyWage').value;
        const costPerOrder = cachedOrderCount > 0 ? ((staff * wage) / cachedOrderCount).toFixed(2) : "0.00";
        document.getElementById('laborCost').innerText = "$" + costPerOrder;
    };

    window.resetDailyStats = () => {
        if (prompt("Manager PIN:") === "1234" && confirm("Wipe all data?")) remove(historyRef);
    };
</script>
</body>
</html>
