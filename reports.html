<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Reports - Performance</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; }
        h1 { color: #1a73e8; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        
        /* Stats Dashboard */
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
        .stat-value { font-size: 2rem; font-weight: bold; color: #1a73e8; display: block; }
        .stat-label { color: #666; font-size: 0.9rem; text-transform: uppercase; }

        /* History Table */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        th { background: #1a73e8; color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        tr:hover { background-color: #f1f8ff; }

        .time-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.85rem; }
        .fast { background: #e6ffed; color: #22863a; }
        .slow { background: #ffeef0; color: #cb2431; }
    </style>
</head>
<body>

<div class="container">
    <h1>Shift Performance Report</h1>

    <div class="stats-row">
        <div class="stat-card">
            <span class="stat-value" id="totalOrders">0</span>
            <span class="stat-label">Total Orders</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="avgCookTime">0m</span>
            <span class="stat-label">Avg. Cook Time</span>
        </div>
        <div class="stat-card">
            <span class="stat-value" id="totalItems">0</span>
            <span class="stat-label">Total Items Sold</span>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Table</th>
                <th>Items</th>
                <th>Wait Time</th>
                <th>Time Completed</th>
            </tr>
        </thead>
        <tbody id="historyBody">
            </tbody>
    </table>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4",
        authDomain: "pos-lovelyentclub.firebaseapp.com",
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com",
        projectId: "pos-lovelyentclub",
        storageBucket: "pos-lovelyentclub.firebasestorage.app",
        messagingSenderId: "271664805776",
        appId: "1:271664805776:web:38b2482645209cd7f56515"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const completedRef = ref(db, 'completedOrders');

    onValue(completedRef, (snapshot) => {
        const data = snapshot.val();
        const tbody = document.getElementById('historyBody');
        const totalOrdersEl = document.getElementById('totalOrders');
        const avgTimeEl = document.getElementById('avgCookTime');
        const totalItemsEl = document.getElementById('totalItems');

        tbody.innerHTML = '';
        if (!data) return;

        let totalWaitMinutes = 0;
        let itemCount = 0;
        const orders = Object.values(data).sort((a, b) => b.completedAt - a.completedAt);

        orders.forEach(order => {
            const cookTime = Math.round((order.completedAt - order.timestamp) / 60000);
            totalWaitMinutes += cookTime;
            itemCount += order.items.length;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td><strong>${order.table}</strong></td>
                <td>${order.items.join(', ')}</td>
                <td><span class="time-badge ${cookTime > 12 ? 'slow' : 'fast'}">${cookTime} mins</span></td>
                <td>${new Date(order.completedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
            `;
            tbody.appendChild(row);
        });

        // Update Dashboard
        totalOrdersEl.innerText = orders.length;
        totalItemsEl.innerText = itemCount;
        avgTimeEl.innerText = orders.length > 0 ? Math.round(totalWaitMinutes / orders.length) + 'm' : '0m';
    });
</script>
</body>
</html>
