<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REPORTS</title>
    <style>
        :root { --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { font-family: var(--font); background: #f8f9fa; margin: 0; padding: 20px; color: #000; }
        .container { max-width: 1000px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; }
        .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 20px; border: 1px solid #000; text-align: center; }
        .stat-value { font-size: 2.2rem; font-weight: 900; display: block; }
        .stat-label { color: #555; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        .rev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        .rev-box { background: #000; color: #fff; padding: 20px; border: 1px solid #000; }
        .rev-title { font-weight: 800; text-transform: uppercase; font-size: 0.8rem; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; display: block; }
        table { width: 100%; border-collapse: collapse; background: white; border: 1px solid #000; }
        th { background: #000; color: #fff; padding: 12px; text-align: left; font-size: 0.8rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #ddd; font-weight: 600; font-size: 0.9rem; }
        .reset-btn { background: #000; color: white; border: none; padding: 10px 15px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>FINANCIAL ANALYTICS</h1><button class="reset-btn" onclick="window.resetDailyStats()">RESET DATA</button></header>
    <div class="stats-row">
        <div class="stat-card"><span class="stat-value" id="grossRevenue">$0</span><span class="stat-label">Gross Revenue</span></div>
        <div class="stat-card"><span class="stat-value" id="avgTicket">$0</span><span class="stat-label">Avg Ticket</span></div>
        <div class="stat-card"><span class="stat-value" id="totalOrders">0</span><span class="stat-label">Total Orders</span></div>
        <div class="stat-card"><span class="stat-value" id="efficiency">0%</span><span class="stat-label">Speed Score</span></div>
    </div>
    <div class="rev-grid">
        <div class="rev-box"><span class="rev-title">Revenue by Table</span><div id="tableSales"></div></div>
        <div class="rev-box"><span class="rev-title">Top Items</span><div id="topItems"></div></div>
    </div>
    <table>
        <thead><tr><th>Table</th><th>Items</th><th>Value</th><th>Cook</th><th>Time</th></tr></thead>
        <tbody id="historyBody"></tbody>
    </table>
</div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4", authDomain: "pos-lovelyentclub.firebaseapp.com", databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com", projectId: "pos-lovelyentclub", storageBucket: "pos-lovelyentclub.firebasestorage.app", messagingSenderId: "271664805776", appId: "1:271664805776:web:38b2482645209cd7f56515" };
    const app = initializeApp(firebaseConfig); const db = getDatabase(app);
    onValue(ref(db, 'history'), (snapshot) => {
        const data = snapshot.val(); const tbody = document.getElementById('historyBody');
        tbody.innerHTML = ''; if (!data) { ["grossRevenue","avgTicket","totalOrders","efficiency"].forEach(id => document.getElementById(id).innerText = "0"); return; }
        let gross = 0, totalMins = 0, fast = 0; const tableMap = {}, itemMap = {};
        const orders = Object.values(data).sort((a,b) => b.completedAt - a.completedAt);
        orders.forEach(o => {
            const val = o.totalValue || 0; const cook = Math.round((o.completedAt - o.timestamp) / 60000);
            gross += val; totalMins += cook; if(cook <= 3) fast++;
            tableMap[o.table] = (tableMap[o.table] || 0) + val;
            o.items.forEach(i => { const q = parseInt(i.split('x ')[0]) || 1; const n = i.split('x ')[1] || i; itemMap[n] = (itemMap[n] || 0) + q; });
            tbody.innerHTML += `<tr><td><strong>${o.table}</strong></td><td>${o.items.join(', ')}</td><td>$${val}</td><td>${cook}m</td><td>${new Date(o.completedAt).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</td></tr>`;
        });
        document.getElementById('grossRevenue').innerText = "$" + gross;
        document.getElementById('avgTicket').innerText = "$" + Math.round(gross / orders.length);
        document.getElementById('totalOrders').innerText = orders.length;
        document.getElementById('efficiency').innerText = Math.round((fast / orders.length) * 100) + "%";
        document.getElementById('tableSales').innerHTML = Object.entries(tableMap).sort((a,b)=>b[1]-a[1]).map(t => `<div>${t[0]}: $${t[1]}</div>`).join('');
        document.getElementById('topItems').innerHTML = Object.entries(itemMap).sort((a,b)=>b[1]-a[1]).slice(0,3).map(i => `<div>${i[0]} (${i[1]})</div>`).join('');
    });
    window.resetDailyStats = () => { if(prompt("Manager PIN:") === "1234" && confirm("Clear all?")) remove(ref(db, 'history')); };
</script>
</body>
</html>
