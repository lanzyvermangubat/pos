<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS WAITER</title>
    <style>
        :root { --bg: #ffffff; --fg: #000000; --gray: #f2f2f2; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 15px; user-select: none; }
        .container { max-width: 600px; margin: auto; border: 1px solid var(--fg); padding: 20px; box-sizing: border-box; background: white; }
        header { border-bottom: 1px solid var(--fg); padding-bottom: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: baseline; }
        h2 { margin: 0; letter-spacing: 1px; font-size: 1.4rem; font-weight: 800; }
        .grid { display: grid; gap: 10px; margin-bottom: 20px; }
        .table-grid { grid-template-columns: repeat(4, 1fr); }
        .cat-grid { grid-template-columns: repeat(2, 1fr); }
        button { background: var(--bg); color: var(--fg); border: 1px solid var(--fg); padding: 15px 5px; font-family: inherit; font-weight: 600; cursor: pointer; transition: 0.1s; }
        button:active { background: var(--fg); color: var(--bg); }
        .selected { background: var(--fg); color: var(--bg); }
        .cat-box { padding: 40px 10px; font-size: 1rem; border-width: 2px; }
        #menuOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; padding: 20px; box-sizing: border-box; }
        .overlay-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--fg); padding-bottom: 15px; margin-bottom: 20px; }
        .item-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .item-btn { padding: 20px 10px; font-size: 1rem; border-radius: 4px; }
        .summary-box { border: 1px solid var(--fg); background: var(--gray); padding: 15px; min-height: 80px; margin-bottom: 20px; position: relative; }
        .pill { border: 1px solid var(--fg); background: white; display: inline-block; padding: 6px 12px; margin: 4px; font-size: 0.9rem; font-weight: bold; }
        .note-input { width: 100%; padding: 12px; border: 1px solid var(--fg); margin-bottom: 15px; font-family: inherit; box-sizing: border-box; display: none; }
        .btn-note { background: #eee; border-style: dashed; margin-bottom: 15px; width: 100%; padding: 10px; }
        .footer { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
        .send-btn { background: var(--fg); color: var(--bg); font-size: 1.2rem; padding: 20px; font-weight: 800; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <header><h2>LOVELY ENT.</h2><div id="clock" style="font-weight:bold;">00:00</div></header>
        <div class="grid table-grid">
            <button onclick="setTable(this, 'T1')">T1</button><button onclick="setTable(this, 'T2')">T2</button><button onclick="setTable(this, 'T3')">T3</button><button onclick="setTable(this, 'T4')">T4</button>
            <button onclick="setTable(this, 'T5')">T5</button><button onclick="setTable(this, 'T6')">T6</button><button onclick="setTable(this, 'T7')">T7</button><button onclick="setTable(this, 'BAR')">BAR</button>
        </div>
        <div class="grid cat-grid">
            <button class="cat-box" onclick="openMenu('Mains')">MAINS</button><button class="cat-box" onclick="openMenu('Sides')">SIDES</button>
            <button class="cat-box" onclick="openMenu('Drinks')">DRINKS</button><button class="cat-box" onclick="openMenu('Dessert')">DESSERT</button>
        </div>
        <div class="summary-box"><div id="orderList"><em>EMPTY ORDER</em></div></div>
        <button class="btn-note" id="noteToggle" onclick="toggleNote()">+ ADD KITCHEN NOTE</button>
        <input type="text" id="orderNote" class="note-input" placeholder="e.g. NO ONIONS / EXTRA ICE">
        <div class="footer"><button class="send-btn" onclick="submitOrder()">SEND ORDER</button><button onclick="resetOrder()">RESET</button></div>
    </div>
    <div id="menuOverlay">
        <div class="overlay-header"><h2 id="overlayTitle">CATEGORY</h2><button onclick="closeMenu()" style="background:var(--fg); color:var(--bg); padding:10px 20px; font-weight:bold;">DONE</button></div>
        <div class="item-grid" id="itemGrid"></div>
    </div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4", authDomain: "pos-lovelyentclub.firebaseapp.com", databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com", projectId: "pos-lovelyentclub", storageBucket: "pos-lovelyentclub.firebasestorage.app", messagingSenderId: "271664805776", appId: "1:271664805776:web:38b2482645209cd7f56515" };
    const app = initializeApp(firebaseConfig); const db = getDatabase(app);
    let currentTable = ""; let orderData = {}; 
    const MENU = { 'Mains': ['Cheese Burger', 'Chicken Burger', 'Pepperoni Pizza', 'Meat Lovers'], 'Sides': ['Fries', 'Onion Rings', 'Nuggets', 'Salad'], 'Drinks': ['Coke', 'Beer', 'Water', 'Iced Tea'], 'Dessert': ['Ice Cream', 'Brownie'] };
    window.setTable = (btn, table) => { document.querySelectorAll('.table-grid button').forEach(b => b.classList.remove('selected')); btn.classList.add('selected'); currentTable = table; };
    window.openMenu = (cat) => { document.getElementById('overlayTitle').innerText = cat.toUpperCase(); document.getElementById('itemGrid').innerHTML = MENU[cat].map(item => `<button class="item-btn" onclick="addItem('${item}')">${item}</button>`).join(''); document.getElementById('menuOverlay').style.display = 'block'; };
    window.closeMenu = () => document.getElementById('menuOverlay').style.display = 'none';
    window.addItem = (item) => { orderData[item] = (orderData[item] || 0) + 1; updateUI(); };
    window.toggleNote = () => { const input = document.getElementById('orderNote'); input.style.display = input.style.display === 'block' ? 'none' : 'block'; };
    function updateUI() { const list = document.getElementById('orderList'); const keys = Object.keys(orderData); list.innerHTML = keys.length ? keys.map(k => `<span class="pill">${orderData[k]}x ${k}</span>`).join('') : '<em>EMPTY ORDER</em>'; }
    window.resetOrder = () => { orderData = {}; currentTable = ""; document.getElementById('orderNote').value = ""; document.getElementById('orderNote').style.display = "none"; updateUI(); document.querySelectorAll('.table-grid button').forEach(b => b.classList.remove('selected')); };
    window.submitOrder = () => { const items = Object.keys(orderData).map(k => `${orderData[k]}x ${k}`); const note = document.getElementById('orderNote').value; if (!currentTable || items.length === 0) return alert("Select Table & Items"); push(ref(db, 'orders'), { table: currentTable, items, note: note || "", timestamp: Date.now() }).then(() => { alert("Sent!"); resetOrder(); }); };
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }, 1000);
</script>
</body>
</html>
