<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOVELY ENT - WAITER</title>
    <style>
        :root { --bg: #ffffff; --fg: #000000; --gray: #f2f2f2; }
        
        html, body { 
            height: 100%; margin: 0; overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--fg);
        }

        .container { display: flex; flex-direction: column; height: 100vh; width: 100vw; padding: 20px; box-sizing: border-box; }
        
        header { border-bottom: 2px solid var(--fg); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: baseline; flex-shrink: 0; }
        h2 { margin: 0; letter-spacing: 1px; font-size: 1.4rem; font-weight: 800; }

        .section-label { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; opacity: 0.6; }

        /* Scrollable Table Grid for high density */
        .table-scroll-container {
            flex-shrink: 0;
            max-height: 25vh;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .table-grid { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
        }

        /* Category Grid expands to fill space */
        .cat-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            flex-grow: 1;
            margin-bottom: 15px;
        }

        button { 
            background: var(--bg); color: var(--fg); border: 2px solid var(--fg); 
            font-family: inherit; font-weight: 800; cursor: pointer; transition: 0.1s; 
        }
        button:active { background: var(--fg); color: var(--bg); }
        .selected { background: var(--fg); color: var(--bg); box-shadow: 0 0 10px rgba(0,0,0,0.2); }

        .table-btn { padding: 10px 5px; font-size: 0.8rem; }
        .cat-btn { font-size: 1.1rem; padding: 20px 5px; }

        /* Summary Box */
        .summary-box { 
            border: 2px solid var(--fg); background: var(--gray); padding: 12px; 
            height: 15vh; margin-bottom: 10px; position: relative; overflow-y: auto;
        }
        .pill { border: 1px solid var(--fg); background: white; display: inline-block; padding: 6px 12px; margin: 3px; font-size: 0.9rem; font-weight: bold; }

        .btn-note { background: #eee; border-style: dashed; margin-bottom: 10px; width: 100%; padding: 10px; flex-shrink: 0; font-weight: 700;}

        .footer { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; flex-shrink: 0; padding-bottom: 10px; }
        .send-btn { background: var(--fg); color: var(--bg); font-size: 1.2rem; padding: 20px; font-weight: 900; border: none; }

        /* Menu Overlay */
        #menuOverlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 1000; padding: 20px; box-sizing: border-box; }
        .overlay-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--fg); padding-bottom: 15px; margin-bottom: 20px; }
        .item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; height: calc(100% - 100px); overflow-y: auto; }
        .item-btn { padding: 25px 10px; font-size: 1rem; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h2>LOVELY ENT CLUB</h2>
            <div id="clock" style="font-weight:bold;">00:00</div>
        </header>

        <div class="section-label">Select Location</div>
        <div class="table-scroll-container">
            <div class="table-grid" id="mainTableGrid">
                </div>
        </div>

        <div class="section-label">Categories</div>
        <div class="grid cat-grid">
            <button class="cat-btn" onclick="openMenu('Mains')">MAINS</button>
            <button class="cat-btn" onclick="openMenu('Sides')">SIDES</button>
            <button class="cat-btn" onclick="openMenu('Drinks')">DRINKS</button>
            <button class="cat-btn" onclick="openMenu('Dessert')">DESSERT</button>
        </div>

        <div class="section-label">Current Order</div>
        <div class="summary-box">
            <div id="orderList"><em>NO ITEMS</em></div>
            <div id="runningTotal" style="margin-top:8px; font-weight:900; font-size: 1.1rem; border-top:1px solid #000; padding-top:5px; display:none;">TOTAL: ₱0</div>
        </div>

        <button class="btn-note" onclick="toggleNote()">+ KITCHEN NOTE</button>
        <input type="text" id="orderNote" style="width:100%; padding:12px; border:2px solid #000; margin-bottom:10px; box-sizing:border-box; display:none;" placeholder="e.g. EXTRA ICE">

        <div class="footer">
            <button class="send-btn" onclick="submitOrder()">SEND ORDER</button>
            <button onclick="resetOrder()">RESET</button>
        </div>
    </div>

    <div id="menuOverlay">
        <div class="overlay-header">
            <h2 id="overlayTitle">MENU</h2>
            <button onclick="closeMenu()" style="background:var(--fg); color:var(--bg); padding:12px 25px; font-weight:bold;">DONE</button>
        </div>
        <div class="item-grid" id="itemGrid"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
    
    const firebaseConfig = { 
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4", 
        authDomain: "pos-lovelyentclub.firebaseapp.com", 
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com", 
        projectId: "pos-lovelyentclub", 
        storageBucket: "pos-lovelyentclub.firebasestorage.app", 
        messagingSenderId: "271664805776", 
        appId: "1:271664805776:web:38b2482645209cd7f56515" 
    };

    const app = initializeApp(firebaseConfig); 
    const db = getDatabase(app);

    let currentTable = ""; 
    let orderData = {}; 
    
    const MENU = { 
        'Mains': { 'Cheese Burger': 280, 'Chicken Burger': 260, 'Pepperoni Pizza': 480, 'Meat Lovers': 550, 'Club Sandwich': 220 },
        'Sides': { 'Fries': 150, 'Onion Rings': 160, 'Nuggets': 180, 'Garlic Bread': 140 },
        'Drinks': { 'Coke': 80, 'Beer': 120, 'Water': 50, 'Iced Tea': 90, 'Whiskey Shot': 250, 'Cocktail': 350 },
        'Dessert': { 'Ice Cream': 150, 'Brownie': 180 }
    };

    // Generate Tables
    const grid = document.getElementById('mainTableGrid');
    const tableList = [];
    for(let i=1; i<=15; i++) tableList.push(`T${i}`);
    for(let i=1; i<=10; i++) tableList.push(`COUCH ${i}`);
    for(let i=1; i<=2; i++) tableList.push(`VIP ${i}`);
    tableList.push('BAR');

    grid.innerHTML = tableList.map(name => 
        `<button class="table-btn" onclick="setTable(this, '${name}')">${name}</button>`
    ).join('');

    window.setTable = (btn, table) => { 
        document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('selected')); 
        btn.classList.add('selected'); 
        currentTable = table; 
    };

    window.openMenu = (cat) => {
        document.getElementById('overlayTitle').innerText = cat.toUpperCase();
        const items = Object.keys(MENU[cat]);
        document.getElementById('itemGrid').innerHTML = items.map(item => `<button class="item-btn" onclick="addItem('${item}')">${item}<br><small>₱${MENU[cat][item]}</small></button>`).join('');
        document.getElementById('menuOverlay').style.display = 'block';
    };

    window.closeMenu = () => document.getElementById('menuOverlay').style.display = 'none';

    window.addItem = (item) => { 
        orderData[item] = (orderData[item] || 0) + 1; 
        updateUI(); 
    };

    window.toggleNote = () => { 
        const input = document.getElementById('orderNote'); 
        input.style.display = input.style.display === 'block' ? 'none' : 'block'; 
    };
    
    function updateUI() {
        const list = document.getElementById('orderList');
        const totalDisp = document.getElementById('runningTotal');
        const keys = Object.keys(orderData);
        let currentTotal = 0;
        
        list.innerHTML = keys.length ? keys.map(k => {
            let price = 0;
            for(let cat in MENU) { if(MENU[cat][k]) price = MENU[cat][k]; }
            currentTotal += (price * orderData[k]);
            return `<span class="pill">${orderData[k]}x ${k}</span>`;
        }).join('') : '<em>NO ITEMS</em>';
        
        if(keys.length > 0) { totalDisp.style.display = "block"; totalDisp.innerText = "TOTAL: ₱" + currentTotal; }
        else { totalDisp.style.display = "none"; }
    }

    window.resetOrder = () => { 
        orderData = {}; currentTable = ""; 
        document.getElementById('orderNote').value = ""; 
        document.getElementById('orderNote').style.display = "none"; 
        updateUI(); 
        document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('selected')); 
    };

    window.submitOrder = () => {
        let orderTotal = 0;
        const items = Object.keys(orderData).map(k => {
            let p = 0; for(let c in MENU) { if(MENU[c][k]) p = MENU[c][k]; }
            orderTotal += (p * orderData[k]);
            return `${orderData[k]}x ${k}`;
        });
        if (!currentTable || items.length === 0) return alert("Select Table & Items");
        push(ref(db, 'orders'), { 
            table: currentTable, 
            items, 
            note: document.getElementById('orderNote').value || "", 
            totalValue: orderTotal, 
            timestamp: Date.now() 
        }).then(() => { 
            alert("Order Sent to Kitchen!"); 
            resetOrder(); 
        });
    };

    setInterval(() => { 
        document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); 
    }, 1000);
</script>
</body>
</html>
