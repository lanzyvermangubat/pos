<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waiter POS - Table Map</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 15px; background: #f0f2f5; margin: 0; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }

        /* Table Map Styles */
        .section-label { font-weight: bold; margin-bottom: 10px; display: block; color: #666; font-size: 0.9rem; text-transform: uppercase; }
        .table-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        .table-btn { padding: 15px 5px; border: 2px solid #ddd; background: white; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .table-btn.selected { background: #1a73e8; color: white; border-color: #1a73e8; transform: scale(1.05); }

        /* Category & Menu Styles */
        .category-tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; }
        .tab-btn { padding: 10px 18px; border: none; background: #e4e6eb; border-radius: 20px; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { background: #1a73e8; color: white; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .menu-item-btn { padding: 18px; border: 1px solid #eee; background: #f8f9fa; border-radius: 12px; cursor: pointer; font-size: 1rem; font-weight: 500; }
        .menu-item-btn:active { background: #e8f0fe; }

        /* Summary */
        .order-summary { background: #fff9c4; padding: 15px; border-radius: 12px; margin-bottom: 20px; min-height: 50px; }
        .added-item { background: #34a853; color: white; padding: 6px 12px; margin: 4px; border-radius: 15px; display: inline-block; font-size: 0.85rem; }
        
        .footer-btns { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
        .send-btn { padding: 20px; background: #34a853; color: white; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; }
        .clear-btn { background: #ea4335; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>LovelyEnt POS</h2>
        
        <span class="section-label">1. Select Table</span>
        <div class="table-grid" id="tableMap">
            <button class="table-btn" onclick="selectTable(this, 'T1')">T1</button>
            <button class="table-btn" onclick="selectTable(this, 'T2')">T2</button>
            <button class="table-btn" onclick="selectTable(this, 'T3')">T3</button>
            <button class="table-btn" onclick="selectTable(this, 'T4')">T4</button>
            <button class="table-btn" onclick="selectTable(this, 'T5')">T5</button>
            <button class="table-btn" onclick="selectTable(this, 'T6')">T6</button>
            <button class="table-btn" onclick="selectTable(this, 'T7')">T7</button>
            <button class="table-btn" onclick="selectTable(this, 'Bar')">Bar</button>
        </div>

        <span class="section-label">2. Select Items</span>
        <div class="category-tabs" id="tabs">
            <button class="tab-btn active" onclick="showCategory('Mains')">🍔 Mains</button>
            <button class="tab-btn" onclick="showCategory('Sides')">🍟 Sides</button>
            <button class="tab-btn" onclick="showCategory('Drinks')">🥤 Drinks</button>
        </div>

        <div class="menu-grid" id="menuDisplay"></div>

        <div class="order-summary">
            <div id="itemListDisplay"><em>No items added...</em></div>
        </div>

        <div class="footer-btns">
            <button class="send-btn" onclick="submitOrder()">SEND ORDER</button>
            <button class="clear-btn" onclick="clearOrder()">RESET</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    // YOUR CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4",
        authDomain: "pos-lovelyentclub.firebaseapp.com",
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com",
        projectId: "pos-lovelyentclub",
        storageBucket: "pos-lovelyentclub.firebasestorage.app",
        messagingSenderId: "271664805776",
        appId: "1:271664805776:web:38b2482645209cd7f56515"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    let selectedTable = "";
    let pendingItems = [];

    // EDIT YOUR MENU ITEMS HERE
    const menu = {
        'Mains': ['Cheese Burger', 'Chicken Burger', 'Pepperoni Pizza', 'Meat Lovers'],
        'Sides': ['Fries', 'Onion Rings', 'Nuggets', 'Coleslaw'],
        'Drinks': ['Coke', 'Beer', 'Water', 'Iced Coffee']
    };

    window.selectTable = (btn, tableNum) => {
        document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedTable = tableNum;
    };

    window.showCategory = (cat) => {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        const display = document.getElementById('menuDisplay');
        display.innerHTML = menu[cat].map(item => 
            `<button class="menu-item-btn" onclick="addItem('${item}')">${item}</button>`
        ).join('');
    };

    window.addItem = (item) => {
        pendingItems.push(item);
        const display = document.getElementById('itemListDisplay');
        if(pendingItems.length === 1) display.innerHTML = '';
        display.innerHTML += `<span class="added-item">${item}</span>`;
    };

    window.clearOrder = () => {
        pendingItems = [];
        selectedTable = "";
        document.getElementById('itemListDisplay').innerHTML = '<em>No items added...</em>';
        document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('selected'));
    };

    window.submitOrder = () => {
        if (!selectedTable) return alert("Please select a table first!");
        if (pendingItems.length === 0) return alert("Please add at least one item!");
        
        push(ref(db, 'orders'), {
            table: selectedTable,
            items: pendingItems,
            timestamp: Date.now()
        }).then(() => {
            alert(`Order sent for ${selectedTable}!`);
            clearOrder();
        });
    };

    showCategory('Mains');
</script>
</body>
</html>
