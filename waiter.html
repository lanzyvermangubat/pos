<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>POS WAITER - FULL SCREEN</title>
    <style>
        :root { --bg: #ffffff; --fg: #000000; --gray: #f2f2f2; }
        
        /* Force body to fill screen */
        html, body { 
            height: 100%; 
            margin: 0; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--fg);
        }

        /* Container fills entire viewport */
        .container { 
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            padding: 20px;
            box-sizing: border-box;
        }
        
        header { 
            border-bottom: 2px solid var(--fg); 
            padding-bottom: 10px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: baseline;
            flex-shrink: 0;
        }
        h2 { margin: 0; letter-spacing: 1px; font-size: 1.6rem; font-weight: 800; }

        .section-label { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; opacity: 0.6; }

        /* Table Grid */
        .table-grid { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        /* Category Grid expands to fill space */
        .cat-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            flex-grow: 2; /* Takes up more room */
            margin-bottom: 20px;
        }

        button { 
            background: var(--bg); 
            color: var(--fg); 
            border: 2px solid var(--fg); 
            font-family: inherit; 
            font-weight: 800; 
            cursor: pointer; 
            transition: 0.1s; 
            font-size: 1.1rem;
        }
        button:active { background: var(--fg); color: var(--bg); }
        .selected { background: var(--fg); color: var(--bg); }

        /* Summary Box expands to fill remaining space */
        .summary-box { 
            border: 2px solid var(--fg); 
            background: var(--gray); 
            padding: 15px; 
            flex-grow: 1; /* Fills leftover gap */
            margin-bottom: 15px; 
            position: relative;
            overflow-y: auto;
        }
        .pill { 
            border: 1px solid var(--fg); 
            background: white; 
            display: inline-block; 
            padding: 8px 15px; 
            margin: 5px; 
            font-size: 1rem; 
            font-weight: bold; 
        }

        .note-input { 
            width: 100%; 
            padding: 15px; 
            border: 2px solid var(--fg); 
            margin-bottom: 15px; 
            font-family: inherit; 
            box-sizing: border-box; 
            display: none; 
            font-size: 1rem;
        }
        .btn-note { 
            background: #eee; 
            border-style: dashed; 
            margin-bottom: 15px; 
            width: 100%; 
            padding: 12px;
            flex-shrink: 0;
        }

        .footer { 
            display: grid; 
            grid-template-columns: 2fr 1fr; 
            gap: 10px; 
            flex-shrink: 0;
            padding-bottom: 10px;
        }
        .send-btn { 
            background: var(--fg); 
            color: var(--bg); 
            font-size: 1.4rem; 
            padding: 25px; 
            font-weight: 900; 
            border: none; 
        }

        /* Overlay Styles */
        #menuOverlay { 
            display: none; 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            background: var(--bg); 
            z-index: 1000; 
            padding: 20px; 
            box-sizing: border-box; 
        }
        .overlay-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 3px solid var(--fg); 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }
        .item-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            height: calc(100% - 100px);
            overflow-y: auto;
        }
        .item-btn { padding: 30px 10px; font-size: 1.2rem; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h2>LOVELY ENTERTAINMENT CLUB</h2>
            <div id="clock" style="font-weight:bold;">00:00</div>
        </header>

        <div class="section-label">Select Table</div>
        <div class="grid table-grid">
            <button onclick="setTable(this, 'T1')">T1</button>
            <button onclick="setTable(this, 'T2')">T2</button>
            <button onclick="setTable(this, 'T3')">T3</button>
            <button onclick="setTable(this, 'T4')">T4</button>
            <button onclick="setTable(this, 'T5')">T5</button>
            <button onclick="setTable(this, 'T6')">T6</button>
            <button onclick="setTable(this, 'T7')">T7</button>
            <button onclick="setTable(this, 'BAR')">BAR</button>
        </div>

        <div class="section-label">Categories</div>
        <div class="grid cat-grid">
            <button onclick="openMenu('Mains')">MAINS</button>
            <button onclick="openMenu('Sides')">SIDES</button>
            <button onclick="openMenu('Drinks')">DRINKS</button>
            <button onclick="openMenu('Dessert')">DESSERT</button>
        </div>

        <div class="section-label">Order Details</div>
        <div class="summary-box">
            <div id="orderList"><em>EMPTY ORDER</em></div>
            <div id="runningTotal" style="margin-top:10px; font-weight:900; font-size: 1.2rem; border-top:2px solid #000; padding-top:10px; display:none;">TOTAL: ₱0</div>
        </div>

        <button class="btn-note" id="noteToggle" onclick="toggleNote()">+ ADD KITCHEN NOTE</button>
        <input type="text" id="orderNote" class="note-input" placeholder="e.g. NO ONIONS / EXTRA ICE">

        <div class="footer">
            <button class="send-btn" onclick="submitOrder()">SEND ORDER</button>
            <button onclick="resetOrder()">RESET</button>
        </div>
    </div>

    <div id="menuOverlay">
        <div class="overlay-header">
            <h2 id="overlayTitle">CATEGORY</h2>
            <button onclick="closeMenu()" style="background:var(--fg); color:var(--bg); padding:15px 30px; font-weight:bold; font-size:1.1rem;">DONE</button>
        </div>
        <div class="item-grid" id="itemGrid"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
    
    const firebaseConfig = { 
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4", 
        authDomain: "pos-lovelyentclub.firebaseapp.com", 
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com", 
        projectId: "pos-lovelyentclub", 
        storageBucket: "pos-lovelyentclub.firebasestorage.app", 
        messagingSenderId: "271664805776", 
        appId: "1:271664805776:web:38b2482645209cd7f56515" 
    };

    const app = initializeApp(firebaseConfig); 
    const db = getDatabase(app);

    let currentTable = ""; 
    let orderData = {}; 
    
    const MENU = { 
        'Mains': { 'Cheese Burger': 250, 'Chicken Burger': 220, 'Pepperoni Pizza': 450, 'Meat Lovers': 550 },
        'Sides': { 'Fries': 120, 'Onion Rings': 150, 'Nuggets': 180, 'Salad': 160 },
        'Drinks': { 'Coke': 60, 'Beer': 100, 'Water': 40, 'Iced Tea': 80 },
        'Dessert': { 'Ice Cream': 120, 'Brownie': 150 }
    };

    window.setTable = (btn, table) => { 
        document.querySelectorAll('.table-grid button').forEach(b => b.classList.remove('selected')); 
        btn.classList.add('selected'); 
        currentTable = table; 
    };

    window.openMenu = (cat) => {
        document.getElementById('overlayTitle').innerText = cat.toUpperCase();
        const items = Object.keys(MENU[cat]);
        document.getElementById('itemGrid').innerHTML = items.map(item => `<button class="item-btn" onclick="addItem('${item}')">${item}<br><small>₱${MENU[cat][item]}</small></button>`).join('');
        document.getElementById('menuOverlay').style.display = 'block';
    };

    window.closeMenu = () => document.getElementById('menuOverlay').style.display = 'none';

    window.addItem = (item) => { 
        orderData[item] = (orderData[item] || 0) + 1; 
        updateUI(); 
    };

    window.toggleNote = () => { 
        const input = document.getElementById('orderNote'); 
        input.style.display = input.style.display === 'block' ? 'none' : 'block'; 
    };
    
    function updateUI() {
        const list = document.getElementById('orderList');
        const totalDisp = document.getElementById('runningTotal');
        const keys = Object.keys(orderData);
        let currentTotal = 0;
        
        list.innerHTML = keys.length ? keys.map(k => {
            let price = 0;
            for(let cat in MENU) { if(MENU[cat][k]) price = MENU[cat][k]; }
            currentTotal += (price * orderData[k]);
            return `<span class="pill">${orderData[k]}x ${k}</span>`;
        }).join('') : '<em>EMPTY ORDER</em>';
        
        if(keys.length > 0) { totalDisp.style.display = "block"; totalDisp.innerText = "TOTAL: ₱" + currentTotal; }
        else { totalDisp.style.display = "none"; }
    }

    window.resetOrder = () => { 
        orderData = {}; currentTable = ""; 
        document.getElementById('orderNote').value = ""; 
        document.getElementById('orderNote').style.display = "none"; 
        updateUI(); 
        document.querySelectorAll('.table-grid button').forEach(b => b.classList.remove('selected')); 
    };

    window.submitOrder = () => {
        let orderTotal = 0;
        const items = Object.keys(orderData).map(k => {
            let p = 0; for(let c in MENU) { if(MENU[c][k]) p = MENU[c][k]; }
            orderTotal += (p * orderData[k]);
            return `${orderData[k]}x ${k}`;
        });
        if (!currentTable || items.length === 0) return alert("Select Table & Items");
        push(ref(db, 'orders'), { 
            table: currentTable, 
            items, 
            note: document.getElementById('orderNote').value || "", 
            totalValue: orderTotal, 
            timestamp: Date.now() 
        }).then(() => { 
            alert("Order Sent!"); 
            resetOrder(); 
        });
    };

    setInterval(() => { 
        document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); 
    }, 1000);
</script>
</body>
</html>
