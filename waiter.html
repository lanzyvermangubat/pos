<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOVELY ENT - PRO POS</title>
    <style>
        :root { --bg: #ffffff; --fg: #000000; --gray: #f2f2f2; --table: #007aff; --couch: #34c759; --vip: #ffcc00; }
        
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--fg); }
        .container { display: flex; flex-direction: column; height: 100vh; width: 100vw; padding: 20px; box-sizing: border-box; }
        
        header { border-bottom: 2px solid var(--fg); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: baseline; flex-shrink: 0; }
        h2 { margin: 0; letter-spacing: 1px; font-size: 1.4rem; font-weight: 800; }

        .section-label { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; opacity: 0.6; }

        /* Compact Location Selection */
        .type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 15px; flex-shrink: 0; }
        .type-btn { padding: 12px 5px; font-size: 0.75rem; border-width: 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .icon-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #000; }
        
        .active-selection { background: #000; color: #fff; padding: 12px; margin-bottom: 15px; font-weight: 900; text-align: center; border: 1px solid #000; font-size: 0.9rem; letter-spacing: 1px; }

        /* Larger Menu Categories */
        .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; flex-grow: 3; margin-bottom: 15px; }
        .cat-btn { font-size: 1.4rem; border-width: 3px; }

        button { background: var(--bg); color: var(--fg); border: 2px solid var(--fg); font-family: inherit; font-weight: 800; cursor: pointer; transition: 0.1s; text-transform: uppercase; }
        button:active { background: var(--fg); color: var(--bg); }
        
        /* Summary & Note */
        .summary-box { border: 2px solid var(--fg); background: var(--gray); padding: 12px; height: 12vh; margin-bottom: 10px; overflow-y: auto; }
        .pill { border: 1px solid var(--fg); background: white; display: inline-block; padding: 6px 12px; margin: 3px; font-size: 0.9rem; font-weight: bold; }
        .btn-note { background: #eee; border-style: dashed; margin-bottom: 10px; width: 100%; padding: 10px; font-weight: 700; border-width: 2px; font-family: inherit; }

        .footer { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; flex-shrink: 0; padding-bottom: 10px; }
        .send-btn { background: var(--fg); color: var(--bg); font-size: 1.3rem; padding: 22px; font-weight: 900; border: none; }

        /* Overlays */
        .full-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 1000; padding: 20px; box-sizing: border-box; }
        .overlay-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--fg); padding-bottom: 15px; margin-bottom: 20px; }
        .scroll-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; height: calc(100% - 100px); overflow-y: auto; }
        .large-btn { padding: 30px 10px; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h2>LOVELY ENT CLUB</h2>
            <div id="clock" style="font-weight:bold;">00:00</div>
        </header>

        <div class="section-label">Location</div>
        <div id="currentTableDisplay" class="active-selection">SELECT LOCATION</div>
        <div class="type-grid">
            <button class="type-btn" onclick="openPicker('TABLE')"><div class="icon-dot" style="background:var(--table)"></div>TABLE</button>
            <button class="type-btn" onclick="openPicker('COUCH')"><div class="icon-dot" style="background:var(--couch)"></div>COUCH</button>
            <button class="type-btn" onclick="openPicker('VIP')"><div class="icon-dot" style="background:var(--vip)"></div>VIP</button>
            <button class="type-btn" onclick="pickTable('BAR')"><div class="icon-dot" style="background:#000"></div>BAR</button>
        </div>

        <div class="section-label">Menu Selection</div>
        <div class="cat-grid">
            <button class="cat-btn" onclick="openMenu('Mains')" style="border-left: 8px solid #000;">MAINS</button>
            <button class="cat-btn" onclick="openMenu('Sides')" style="border-left: 8px solid #444;">SIDES</button>
            <button class="cat-btn" onclick="openMenu('Drinks')" style="border-left: 8px solid #888;">DRINKS</button>
            <button class="cat-btn" onclick="openMenu('Dessert')" style="border-left: 8px solid #ccc;">DESSERT</button>
        </div>

        <div class="summary-box">
            <div id="orderList"><em>NO ITEMS</em></div>
            <div id="runningTotal" style="margin-top:8px; font-weight:900; font-size: 1.1rem; border-top:1px solid #000; padding-top:5px; display:none;">TOTAL: ₱0</div>
        </div>

        <button class="btn-note" onclick="toggleNote()">+ KITCHEN NOTE</button>
        <input type="text" id="orderNote" style="width:100%; padding:15px; border:2px solid #000; margin-bottom:10px; box-sizing:border-box; display:none;" placeholder="e.g. LESS ICE">

        <div class="footer">
            <button class="send-btn" onclick="submitOrder()">SEND ORDER</button>
            <button onclick="resetOrder()">RESET</button>
        </div>
    </div>

    <div id="pickerOverlay" class="full-overlay">
        <div class="overlay-header">
            <h2 id="pickerTitle">SELECT</h2>
            <button onclick="closePicker()" style="background:var(--fg); color:var(--bg); padding:12px 25px; font-weight:bold;">BACK</button>
        </div>
        <div class="scroll-grid" id="pickerGrid"></div>
    </div>

    <div id="menuOverlay" class="full-overlay">
        <div class="overlay-header">
            <h2 id="menuTitle">MENU</h2>
            <button onclick="closeMenu()" style="background:var(--fg); color:var(--bg); padding:12px 25px; font-weight:bold;">BACK</button>
        </div>
        <div class="scroll-grid" id="menuGrid" style="grid-template-columns: repeat(2, 1fr);"></div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
    
    const firebaseConfig = { 
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4", 
        authDomain: "pos-lovelyentclub.firebaseapp.com", 
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com", 
        projectId: "pos-lovelyentclub", 
        storageBucket: "pos-lovelyentclub.firebasestorage.app", 
        messagingSenderId: "271664805776", 
        appId: "1:271664805776:web:38b2482645209cd7f56515" 
    };

    const app = initializeApp(firebaseConfig); 
    const db = getDatabase(app);

    let currentTable = ""; 
    let orderData = {}; 
    
    const MENU = { 
        'Mains': { 'Cheese Burger': 280, 'Chicken Burger': 260, 'Pepperoni Pizza': 480, 'Meat Lovers': 550 },
        'Sides': { 'Fries': 150, 'Onion Rings': 160, 'Nuggets': 180, 'Salad': 160 },
        'Drinks': { 'Coke': 80, 'Beer': 120, 'Water': 50, 'Iced Tea': 90, 'Whiskey Shot': 250 },
        'Dessert': { 'Ice Cream': 150, 'Brownie': 180 }
    };

    const TABLE_COUNTS = { 'TABLE': 15, 'COUCH': 10, 'VIP': 2 };

    window.openPicker = (type) => {
        document.getElementById('pickerTitle').innerText = `${type} NUMBER`;
        const grid = document.getElementById('pickerGrid');
        grid.innerHTML = '';
        
        let color = "var(--table)";
        if(type === 'COUCH') color = "var(--couch)";
        if(type === 'VIP') color = "var(--vip)";

        for(let i=1; i <= TABLE_COUNTS[type]; i++) {
            const name = `${type} ${i}`;
            grid.innerHTML += `<button class="large-btn" style="border-color:${color}" onclick="pickTable('${name}')">${name}</button>`;
        }
        document.getElementById('pickerOverlay').style.display = 'block';
    };

    window.closePicker = () => document.getElementById('pickerOverlay').style.display = 'none';

    window.pickTable = (name) => {
        currentTable = name;
        document.getElementById('currentTableDisplay').innerText = name;
        document.getElementById('currentTableDisplay').style.background = "#fff";
        document.getElementById('currentTableDisplay').style.color = "#000";
        closePicker();
    };

    window.openMenu = (cat) => {
        document.getElementById('menuTitle').innerText = cat.toUpperCase();
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = Object.keys(MENU[cat]).map(item => 
            `<button class="large-btn" onclick="addItem('${item}')">${item}<br><small>₱${MENU[cat][item]}</small></button>`
        ).join('');
        document.getElementById('menuOverlay').style.display = 'block';
    };

    window.closeMenu = () => document.getElementById('menuOverlay').style.display = 'none';

    window.addItem = (item) => { 
        orderData[item] = (orderData[item] || 0) + 1; 
        updateUI(); 
    };

    window.toggleNote = () => { 
        const input = document.getElementById('orderNote'); 
        input.style.display = input.style.display === 'block' ? 'none' : 'block'; 
    };
    
    function updateUI() {
        const list = document.getElementById('orderList');
        const totalDisp = document.getElementById('runningTotal');
        const keys = Object.keys(orderData);
        let currentTotal = 0;
        
        list.innerHTML = keys.length ? keys.map(k => {
            let price = 0;
            for(let cat in MENU) { if(MENU[cat][k]) price = MENU[cat][k]; }
            currentTotal += (price * orderData[k]);
            return `<span class="pill">${orderData[k]}x ${k}</span>`;
        }).join('') : '<em>NO ITEMS</em>';
        
        if(keys.length > 0) { totalDisp.style.display = "block"; totalDisp.innerText = "TOTAL: ₱" + currentTotal; }
        else { totalDisp.style.display = "none"; }
    }

    window.resetOrder = () => { 
        orderData = {}; currentTable = ""; 
        document.getElementById('currentTableDisplay').innerText = "SELECT LOCATION";
        document.getElementById('currentTableDisplay').style.background = "#000";
        document.getElementById('currentTableDisplay').style.color = "#fff";
        document.getElementById('orderNote').value = ""; 
        document.getElementById('orderNote').style.display = "none"; 
        updateUI(); 
    };

    window.submitOrder = () => {
        let orderTotal = 0;
        const items = Object.keys(orderData).map(k => {
            let p = 0; for(let c in MENU) { if(MENU[c][k]) p = MENU[c][k]; }
            orderTotal += (p * orderData[k]);
            return `${orderData[k]}x ${k}`;
        });
        if (!currentTable || items.length === 0) return alert("Select Location & Items");
        push(ref(db, 'orders'), { 
            table: currentTable, 
            items, 
            note: document.getElementById('orderNote').value || "", 
            totalValue: orderTotal, 
            timestamp: Date.now() 
        }).then(() => { 
            alert("Sent!"); 
            resetOrder(); 
        });
    };

    setInterval(() => { 
        document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); 
    }, 1000);
</script>
</body>
</html>
