<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LOVELY ENT - PRO POS</title>
    <style>
        :root { --bg: #ffffff; --fg: #000000; --gray: #f2f2f2; --table: #007aff; --couch: #34c759; --vip: #ffcc00; }
        html, body { height: 100%; margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
        .container { display: flex; flex-direction: column; height: 100vh; width: 100vw; padding: 15px; box-sizing: border-box; }
        
        header { border-bottom: 2px solid var(--fg); padding-bottom: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; flex-shrink: 0; }
        h2 { margin: 0; letter-spacing: 1px; font-size: 1.2rem; font-weight: 800; }
        .section-label { font-size: 0.65rem; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; opacity: 0.6; }

        /* Location Bar */
        .type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
        .type-btn { padding: 10px 5px; font-size: 0.7rem; border: 2px solid #000; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; background: #fff; cursor: pointer; }
        .icon-dot { width: 10px; height: 10px; border-radius: 50%; }
        .active-selection { background: #000; color: #fff; padding: 10px; margin-bottom: 10px; font-weight: 900; text-align: center; border: 1px solid #000; font-size: 0.9rem; }

        /* Split Menu Selection */
        .menu-layout { display: grid; grid-template-columns: 1.2fr 1fr; gap: 15px; flex-grow: 1; overflow: hidden; margin-bottom: 10px; }
        .menu-column { display: flex; flex-direction: column; gap: 8px; }
        .cat-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
        .cat-btn { padding: 15px 10px; font-size: 1rem; border-width: 3px; text-align: left; font-weight: 900; cursor: pointer; background: #fff; }

        /* Summary Area */
        .status-bar { background: #eee; padding: 8px; font-size: 0.7rem; font-weight: 800; display: flex; justify-content: space-around; border: 1px solid #000; margin-bottom: 8px; }
        .summary-box { border: 2px solid var(--fg); background: var(--gray); padding: 10px; height: 10vh; margin-bottom: 10px; overflow-y: auto; flex-shrink: 0; }
        .pill { border: 1px solid var(--fg); background: white; display: inline-block; padding: 5px 10px; margin: 2px; font-size: 0.8rem; font-weight: bold; }

        .footer { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; flex-shrink: 0; padding-bottom: 5px; }
        .send-btn { background: var(--fg); color: var(--bg); font-size: 1.2rem; padding: 18px; font-weight: 900; border: none; cursor: pointer; }

        /* Overlays */
        .full-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: var(--bg); z-index: 1000; padding: 20px; box-sizing: border-box; }
        .overlay-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid var(--fg); padding-bottom: 15px; margin-bottom: 20px; }
        .scroll-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; height: calc(100% - 100px); overflow-y: auto; }
        .large-btn { padding: 25px 10px; font-size: 1.1rem; font-weight: 800; border: 2px solid #000; background: #fff; }

        /* Confirmation Modal */
        #confirmOverlay { background: rgba(0,0,0,0.85); color: #fff; display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; padding: 30px; box-sizing: border-box; }
        .confirm-card { background: #fff; color: #000; width: 100%; max-width: 500px; padding: 25px; border-radius: 10px; }
        .confirm-items { margin: 20px 0; max-height: 40vh; overflow-y: auto; border-top: 1px solid #eee; padding-top: 15px; }
        .confirm-type { font-size: 0.7rem; font-weight: 800; color: #666; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h2>LOVELY ENT CLUB</h2><div id="clock" style="font-weight:bold;">00:00</div></header>

        <div class="section-label">Location</div>
        <div id="currentTableDisplay" class="active-selection">SELECT LOCATION</div>
        <div class="type-grid">
            <button class="type-btn" onclick="openPicker('TABLE')"><div class="icon-dot" style="background:var(--table)"></div>TABLE</button>
            <button class="type-btn" onclick="openPicker('COUCH')"><div class="icon-dot" style="background:var(--couch)"></div>COUCH</button>
            <button class="type-btn" onclick="openPicker('VIP')"><div class="icon-dot" style="background:var(--vip)"></div>VIP</button>
            <button class="type-btn" onclick="pickTable('BAR')"><div class="icon-dot" style="background:#000"></div>BAR</button>
        </div>

        <div class="menu-layout">
            <div class="menu-column">
                <div class="section-label">🍽️ Kitchen Menu</div>
                <div class="cat-grid">
                    <button class="cat-btn" onclick="openMenu('Appetizers')" style="border-left: 10px solid #000;">Appetizers</button>
                    <button class="cat-btn" onclick="openMenu('Soups')" style="border-left: 10px solid #000;">Soups</button>
                    <button class="cat-btn" onclick="openMenu('Salads')" style="border-left: 10px solid #000;">Salads</button>
                    <button class="cat-btn" onclick="openMenu('Mains')" style="border-left: 10px solid #000;">Mains</button>
                    <button class="cat-btn" onclick="openMenu('Desserts')" style="border-left: 10px solid #000;">Desserts</button>
                </div>
            </div>
            <div class="menu-column">
                <div class="section-label">🍺 Bar Menu</div>
                <div class="cat-grid">
                    <button class="cat-btn" onclick="openMenu('Alcoholic')" style="border-left: 10px solid var(--table);">Alcoholic</button>
                    <button class="cat-btn" onclick="openMenu('Beverages')" style="border-left: 10px solid var(--table);">Beverages</button>
                </div>
            </div>
        </div>

        <div class="status-bar" id="liveStatus">
            <span id="kitStatus">🍽️ KITCHEN: --</span>
            <span id="barStatus">🍺 BAR: --</span>
        </div>

        <div class="summary-box" id="orderList"><em>NO ITEMS</em></div>

        <div class="footer">
            <button class="send-btn" onclick="showConfirmation()">SEND ORDER</button>
            <button onclick="resetOrder()" style="font-weight:800; border:2px solid #000; background:#fff;">RESET</button>
        </div>
    </div>

    <div id="pickerOverlay" class="full-overlay">
        <div class="overlay-header"><h2>SELECT NUMBER</h2><button onclick="closeOverlay('pickerOverlay')" style="background:#000; color:#fff; padding:12px 25px; font-weight:800;">BACK</button></div>
        <div class="scroll-grid" id="pickerGrid" style="grid-template-columns: repeat(3, 1fr);"></div>
    </div>

    <div id="menuOverlay" class="full-overlay">
        <div class="overlay-header"><h2 id="menuTitle">MENU</h2><button onclick="closeOverlay('menuOverlay')" style="background:#000; color:#fff; padding:12px 25px; font-weight:800;">DONE</button></div>
        <div class="scroll-grid" id="menuGrid"></div>
    </div>

    <div id="confirmOverlay">
        <div class="confirm-card">
            <h2 style="margin:0; border-bottom:2px solid #000; padding-bottom:10px;">Confirm Order</h2>
            <p id="confirmTable" style="font-weight:900; font-size:1.2rem; margin:15px 0;"></p>
            <div class="confirm-items" id="confirmList"></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:20px;">
                <button onclick="closeConfirmation()" style="padding:20px; font-weight:800; border:2px solid #000; background:#fff;">CANCEL</button>
                <button onclick="submitOrder()" style="padding:20px; font-weight:900; background:#000; color:#fff; border:none;">SEND NOW</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4", authDomain: "pos-lovelyentclub.firebaseapp.com", databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com", projectId: "pos-lovelyentclub", storageBucket: "pos-lovelyentclub.firebasestorage.app", messagingSenderId: "271664805776", appId: "1:271664805776:web:38b2482645209cd7f56515" };
    const app = initializeApp(firebaseConfig); const db = getDatabase(app);

    let currentTable = ""; let orderData = {}; 
    const MENU = { 
        'Appetizers': { 'Nachos': 180, 'Calamari': 220, 'Wings': 250 },
        'Soups': { 'Mushroom': 150, 'Pumpkin': 150 },
        'Salads': { 'Caesar': 220, 'Greek': 240 },
        'Mains': { 'Burger': 280, 'Pizza': 480, 'Steak': 850 },
        'Desserts': { 'Ice Cream': 150, 'Brownie': 180 },
        'Alcoholic': { 'Beer': 120, 'Whiskey': 250, 'Gin': 300, 'Cocktail': 320 },
        'Beverages': { 'Coke': 80, 'Water': 50, 'Iced Tea': 90 }
    };
    const BAR_CATS = ['Alcoholic', 'Beverages'];

    // STATUS MONITOR
    onValue(ref(db, 'orders'), (snap) => {
        const data = snap.val(); if (!data || !currentTable) return;
        Object.values(data).forEach(o => {
            if (o.table === currentTable) {
                const k = document.getElementById('kitStatus'), b = document.getElementById('barStatus');
                k.innerText = o.kitchenDone ? "🍽️ KITCHEN: READY" : "🍽️ KITCHEN: PENDING";
                b.innerText = o.barDone ? "🍺 BAR: READY" : "🍺 BAR: PENDING";
                k.style.color = o.kitchenDone ? "#27ae60" : "#e67e22"; b.style.color = o.barDone ? "#27ae60" : "#e67e22";
            }
        });
    });

    window.openPicker = (type) => {
        const grid = document.getElementById('pickerGrid'); grid.innerHTML = '';
        const counts = { 'TABLE': 15, 'COUCH': 10, 'VIP': 2 };
        for(let i=1; i <= counts[type]; i++) grid.innerHTML += `<button class="large-btn" onclick="pickTable('${type} ${i}')">${type} ${i}</button>`;
        document.getElementById('pickerOverlay').style.display = 'block';
    };
    window.pickTable = (n) => { currentTable = n; document.getElementById('currentTableDisplay').innerText = n; closeOverlay('pickerOverlay'); };
    window.openMenu = (cat) => {
        document.getElementById('menuTitle').innerText = cat.toUpperCase();
        document.getElementById('menuGrid').innerHTML = Object.keys(MENU[cat]).map(i => `<button class="large-btn" onclick="addItem('${i}')">${i}<br><small>₱${MENU[cat][i]}</small></button>`).join('');
        document.getElementById('menuOverlay').style.display = 'block';
    };
    window.addItem = (i) => { orderData[i] = (orderData[i] || 0) + 1; updateUI(); };
    window.closeOverlay = (id) => document.getElementById(id).style.display = 'none';

    function updateUI() {
        const keys = Object.keys(orderData);
        document.getElementById('orderList').innerHTML = keys.length ? keys.map(k => `<span class="pill">${orderData[k]}x ${k}</span>`).join('') : '<em>NO ITEMS</em>';
    }

    // CONFIRMATION LOGIC
    window.showConfirmation = () => {
        if (!currentTable || Object.keys(orderData).length === 0) return alert("Select Table and Items first!");
        const list = document.getElementById('confirmList'); list.innerHTML = '';
        document.getElementById('confirmTable').innerText = "Location: " + currentTable;
        
        let kItems = [], bItems = [];
        Object.keys(orderData).forEach(item => {
            let cat = ""; for(let c in MENU) { if(MENU[c][item]) cat = c; }
            const row = `<div>• ${orderData[item]}x ${item}</div>`;
            BAR_CATS.includes(cat) ? bItems.push(row) : kItems.push(row);
        });

        if(kItems.length) list.innerHTML += `<div class="confirm-type">TO KITCHEN</div>` + kItems.join('');
        if(bItems.length) list.innerHTML += `<div class="confirm-type">TO BAR</div>` + bItems.join('');
        document.getElementById('confirmOverlay').style.display = 'flex';
    };
    window.closeConfirmation = () => document.getElementById('confirmOverlay').style.display = 'none';

    window.submitOrder = () => {
        let total = 0;
        const details = Object.keys(orderData).map(k => {
            let p = 0, cat = ""; for(let c in MENU) { if(MENU[c][k]) { p = MENU[c][k]; cat = c; } }
            total += (p * orderData[k]);
            return { name: k, qty: orderData[k], type: BAR_CATS.includes(cat) ? 'bar' : 'kitchen' };
        });
        const hasK = details.some(d => d.type === 'kitchen'), hasB = details.some(d => d.type === 'bar');

        push(ref(db, 'orders'), { 
            table: currentTable, 
            items: details.map(d => `${d.qty}x ${d.name}`),
            details, kitchenDone: !hasK, barDone: !hasB, 
            totalValue: total, timestamp: Date.now() 
        }).then(() => { resetOrder(); closeConfirmation(); });
    };

    window.resetOrder = () => { orderData = {}; currentTable = ""; document.getElementById('currentTableDisplay').innerText = "SELECT LOCATION"; updateUI(); };
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }, 1000);
</script>
</body>
</html>
