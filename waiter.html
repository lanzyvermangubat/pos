<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS - Station Monitor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding: 15px 20px; background: #1e1e1e; }
        .station-badge { background: #1a73e8; padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; text-transform: uppercase; }
        .main-layout { display: grid; grid-template-columns: 1fr 300px; flex-grow: 1; overflow: hidden; }
        .kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; align-content: start; }
        .order-card { background: #1e1e1e; border-radius: 12px; border-top: 10px solid #4CAF50; display: flex; flex-direction: column; }
        .order-header { padding: 10px 15px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; font-weight: bold; }
        .order-items { padding: 15px; flex-grow: 1; font-size: 1.2rem; color: #e0e0e0; }
        .order-item { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .btn-bump { width: 100%; padding: 15px; background: #4CAF50; border: none; color: white; font-weight: bold; cursor: pointer; border-radius: 0 0 12px 12px; }
        .prep-sidebar { background: #1a1a1a; border-left: 2px solid #333; padding: 20px; overflow-y: auto; }
        .summary-title { font-size: 1.1rem; font-weight: bold; color: #ff9800; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .prep-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; }
        .prep-count { background: #ff9800; color: black; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:15px;">
        <h1 style="margin:0; font-size: 1.5rem;">KITCHEN MONITOR</h1>
        <span id="stationName" class="station-badge">Full Kitchen</span>
    </div>
    <div id="clock">00:00:00</div>
</header>

<div class="main-layout">
    <div class="kds-grid" id="orderContainer"></div>
    <div class="prep-sidebar">
        <div class="summary-title">STATION PREP</div>
        <div id="prepSummary"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4",
        authDomain: "pos-lovelyentclub.firebaseapp.com",
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com",
        projectId: "pos-lovelyentclub",
        storageBucket: "pos-lovelyentclub.firebasestorage.app",
        messagingSenderId: "271664805776",
        appId: "1:271664805776:web:38b2482645209cd7f56515"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- STATION LOGIC ---
    // URL Usage: index.html?station=Drinks or index.html?station=Mains
    const params = new URLSearchParams(window.location.search);
    const currentStation = params.get('station'); // e.g., "Drinks"
    if (currentStation) document.getElementById('stationName').innerText = currentStation;

    // Define which items belong to which station (Match your menu exactly!)
    const stationItems = {
        'Mains': ['Cheese Burger', 'Chicken Burger', 'Pepperoni Pizza', 'Meat Lovers'],
        'Sides': ['Fries', 'Onion Rings', 'Nuggets', 'Coleslaw'],
        'Drinks': ['Coke', 'Beer', 'Water', 'Iced Coffee']
    };

    onValue(ref(db, 'orders'), (snapshot) => {
        const orderContainer = document.getElementById('orderContainer');
        const prepSummary = document.getElementById('prepSummary');
        const data = snapshot.val();
        
        orderContainer.innerHTML = '';
        prepSummary.innerHTML = '';
        if (!data) return;

        const totals = {};

        Object.entries(data).forEach(([id, order]) => {
            // Filter items based on the station
            const itemsForThisStation = currentStation 
                ? order.items.filter(item => stationItems[currentStation].includes(item))
                : order.items;

            // Only show the card if there's something for this station to do
            if (itemsForThisStation.length > 0) {
                const waitTime = Math.floor((Date.now() - order.timestamp) / 60000);
                const card = document.createElement('div');
                card.className = 'order-card';
                card.innerHTML = `
                    <div class="order-header"><span>${order.table}</span><span>${waitTime}m</span></div>
                    <div class="order-items">
                        ${itemsForThisStation.map(i => `<div class="order-item">${i}</div>`).join('')}
                    </div>
                    <button class="btn-bump" onclick="window.bumpOrder('${id}')">DONE</button>
                `;
                orderContainer.appendChild(card);

                itemsForThisStation.forEach(item => {
                    totals[item] = (totals[item] || 0) + 1;
                });
            }
        });

        Object.keys(totals).sort().forEach(name => {
            prepSummary.innerHTML += `<div class="prep-item"><span>${name}</span><span class="prep-count">${totals[name]}</span></div>`;
        });
    });

    window.bumpOrder = (id) => remove(ref(db, `orders/${id}`));
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
