<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST FOOD KDS</title>
    <style>
        body { font-family: 'Arial Black', sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; height: 100vh; overflow: hidden; }
        
        /* Fixed 8-slot Grid */
        .kds-container { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            grid-template-rows: repeat(2, 1fr); 
            gap: 10px; 
            height: calc(100vh - 60px); 
        }

        .slot { border: 3px solid #fff; background: #000; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Fast Food Header Style */
        .slot-head { 
            background: #fff; color: #000; padding: 5px 10px; 
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 1.2rem; border-bottom: 2px solid #fff;
        }

        .slot-body { padding: 10px; flex-grow: 1; font-size: 1.4rem; line-height: 1.2; }
        
        /* Kitchen Notes in Red/Highlight */
        .item-note { color: #ffff00; font-size: 0.9rem; font-family: sans-serif; margin-left: 10px; display: block; }

        .slot-foot { 
            background: #333; color: #fff; text-align: center; padding: 12px; 
            cursor: pointer; font-size: 1rem; border-top: 2px solid #fff;
        }

        /* Urgency: Blinking for Fast Food Rush */
        .urgent .slot-head { background: #ff0000 !important; color: #fff !important; animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.2; } }

        header { display: flex; justify-content: space-between; padding: 10px; border-bottom: 2px solid #fff; margin-bottom: 10px; }
        .clock { font-size: 1.5rem; }
    </style>
</head>
<body>

    <header>
        <div>KITCHEN PRODUCTION</div>
        <div id="clock" class="clock">00:00:00</div>
    </header>

    <div class="kds-container" id="kdsGrid">
        </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4",
        authDomain: "pos-lovelyentclub.firebaseapp.com",
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com",
        projectId: "pos-lovelyentclub",
        storageBucket: "pos-lovelyentclub.firebasestorage.app",
        messagingSenderId: "271664805776",
        appId: "1:271664805776:web:38b2482645209cd7f56515"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, 'orders'), (snapshot) => {
        const grid = document.getElementById('kdsGrid');
        const data = snapshot.val();
        grid.innerHTML = '';
        if (!data) return;

        // Take only the first 8 orders to maintain the Fast Food grid look
        Object.entries(data).slice(0, 8).forEach(([id, order]) => {
            const ageSec = Math.floor((Date.now() - order.timestamp) / 1000);
            const ageMin = Math.floor(ageSec / 60);
            const displayTime = `${ageMin}:${(ageSec % 60).toString().padStart(2, '0')}`;
            
            const isUrgent = ageMin >= 3; // Fast food target is < 3 mins

            const slot = document.createElement('div');
            slot.className = `slot ${isUrgent ? 'urgent' : ''}`;
            slot.innerHTML = `
                <div class="slot-head">
                    <span>${order.table}</span>
                    <span>${displayTime}</span>
                </div>
                <div class="slot-body">
                    ${order.items.map(i => `<div>${i}</div>`).join('')}
                    ${order.note ? `<span class="item-note">* ${order.note}</span>` : ''}
                </div>
                <div class="slot-foot" onclick='window.bump("${id}", ${JSON.stringify(order)})'>CLEAR</div>
            `;
            grid.appendChild(slot);
        });
    });

    window.bump = (id, order) => {
        push(ref(db, 'completedOrders'), {...order, completedAt: Date.now()})
        .then(() => remove(ref(db, `orders/${id}`)));
    };

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
