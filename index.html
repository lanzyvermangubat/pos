<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS - Kitchen Monitor</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .order-card { background: #1e1e1e; border-radius: 12px; border-top: 10px solid #4CAF50; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .order-header { padding: 15px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2rem; }
        .order-items { padding: 20px; flex-grow: 1; font-size: 1.4rem; color: #e0e0e0; }
        .order-item { margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        .btn-bump { width: 100%; padding: 20px; background: #4CAF50; border: none; color: white; font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 0 0 12px 12px; transition: 0.2s; }
        .btn-bump:hover { background: #45a049; }
        .warning { border-top-color: #ff9800; }
        .critical { border-top-color: #f44336; animation: glow 1.5s infinite; }
        @keyframes glow { 0% { box-shadow: 0 0 5px #f44336; } 50% { box-shadow: 0 0 20px #f44336; } 100% { box-shadow: 0 0 5px #f44336; } }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0;">KITCHEN MONITOR</h1>
    <div id="clock">00:00:00</div>
</header>

<div class="kds-grid" id="orderContainer"></div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4",
        authDomain: "pos-lovelyentclub.firebaseapp.com",
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com",
        projectId: "pos-lovelyentclub",
        storageBucket: "pos-lovelyentclub.firebasestorage.app",
        messagingSenderId: "271664805776",
        appId: "1:271664805776:web:38b2482645209cd7f56515",
        measurementId: "G-Z70F1BPPE8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const ordersRef = ref(db, 'orders');

    onValue(ordersRef, (snapshot) => {
        const container = document.getElementById('orderContainer');
        const data = snapshot.val();
        container.innerHTML = '';
        if (!data) return;

        Object.entries(data).forEach(([id, order]) => {
            const waitTime = Math.floor((Date.now() - order.timestamp) / 60000);
            let urgency = waitTime > 15 ? 'critical' : (waitTime > 8 ? 'warning' : '');

            const card = document.createElement('div');
            card.className = `order-card ${urgency}`;
            card.innerHTML = `
                <div class="order-header">
                    <span>Table: ${order.table}</span>
                    <span>${waitTime}m</span>
                </div>
                <div class="order-items">
                    ${order.items.map(i => `<div class="order-item">${i}</div>`).join('')}
                </div>
                <button class="btn-bump" onclick="window.bumpOrder('${id}')">DONE / BUMP</button>
            `;
            container.appendChild(card);
        });
    });

    window.bumpOrder = (id) => {
        remove(ref(db, `orders/${id}`));
    };

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
