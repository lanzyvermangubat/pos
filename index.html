<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS - LIGHT MONITOR</title>
    <style>
        body { font-family: sans-serif; background: #ffffff; color: #000; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { border-bottom: 2px solid #000; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .layout { display: grid; grid-template-columns: 1fr 300px; flex: 1; overflow: hidden; }
        .kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; align-content: start; }
        
        .card { border: 2px solid #000; background: #fff; display: flex; flex-direction: column; }
        .card-head { border-bottom: 2px solid #000; padding: 10px; font-weight: 900; display: flex; justify-content: space-between; font-size: 1.2rem; }
        .card-body { padding: 15px; flex-grow: 1; font-size: 1.3rem; font-weight: 500; }
        .note-box { background: #000; color: #fff; padding: 8px; margin-top: 10px; font-size: 0.9rem; font-weight: bold; text-transform: uppercase; }
        
        .card-foot { border-top: 2px solid #000; padding: 15px; text-align: center; cursor: pointer; font-weight: 900; background: #fff; }
        .card-foot:active { background: #000; color: #fff; }

        .sidebar { border-left: 2px solid #000; background: #f9f9f9; padding: 20px; overflow-y: auto; }
        .sidebar-title { border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px; font-weight: 900; letter-spacing: 1px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: 600; }
        
        .urgent { background: #000; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0; font-size:1.5rem; font-weight:900;">KITCHEN MONITOR</h1>
        <div id="clock" style="font-weight:bold;">00:00:00</div>
    </header>

    <div class="layout">
        <div class="kds-grid" id="kdsGrid"></div>
        <div class="sidebar">
            <div class="sidebar-title">PREP TOTALS</div>
            <div id="prepTotals"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4",
        authDomain: "pos-lovelyentclub.firebaseapp.com",
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com",
        projectId: "pos-lovelyentclub",
        storageBucket: "pos-lovelyentclub.firebasestorage.app",
        messagingSenderId: "271664805776",
        appId: "1:271664805776:web:38b2482645209cd7f56515"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, 'orders'), (snapshot) => {
        const grid = document.getElementById('kdsGrid');
        const prep = document.getElementById('prepTotals');
        const data = snapshot.val();
        grid.innerHTML = ''; prep.innerHTML = '';
        if (!data) return;

        const totals = {};
        Object.entries(data).forEach(([id, order]) => {
            const age = Math.floor((Date.now() - order.timestamp) / 60000);
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-head ${age > 10 ? 'urgent' : ''}"><span>${order.table}</span><span>${age}m</span></div>
                <div class="card-body">
                    ${order.items.map(i => `<div style="margin-bottom:5px;">${i}</div>`).join('')}
                    ${order.note ? `<div class="note-box">NOTE: ${order.note}</div>` : ''}
                </div>
                <div class="card-foot" onclick='window.bump("${id}", ${JSON.stringify(order)})'>BUMP</div>
            `;
            grid.appendChild(card);

            order.items.forEach(i => {
                const [qty, ...nameParts] = i.split('x ');
                const name = nameParts.join('x ');
                totals[name] = (totals[name] || 0) + parseInt(qty);
            });
        });

        Object.keys(totals).sort().forEach(item => {
            prep.innerHTML += `<div class="summary-row"><span>${item}</span><span>${totals[item]}</span></div>`;
        });
    });

    window.bump = (id, order) => {
        push(ref(db, 'completedOrders'), {...order, completedAt: Date.now()})
        .then(() => remove(ref(db, `orders/${id}`)));
    };
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
