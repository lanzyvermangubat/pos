<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kitchen Monitor POS</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #333; padding-bottom: 10px; }
        
        .kds-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 20px; 
            margin-top: 20px; 
        }

        .order-card { 
            background: #2d2d2d; 
            border-radius: 8px; 
            display: flex; 
            flex-direction: column;
            border-top: 8px solid #4CAF50;
        }

        .order-header { padding: 10px; background: rgba(255,255,255,0.05); display: flex; justify-content: space-between; }
        .order-items { padding: 15px; flex-grow: 1; font-size: 1.2rem; }
        .order-item { margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 4px; }
        
        .order-footer { padding: 10px; }
        .btn-complete { 
            width: 100%; padding: 12px; background: #4CAF50; border: none; 
            color: white; font-weight: bold; cursor: pointer; border-radius: 4px;
        }

        /* Urgency Colors */
        .warning { border-top-color: #ff9800 !important; }
        .critical { border-top-color: #f44336 !important; animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0px rgba(244, 67, 54, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(244, 67, 54, 0); }
            100% { box-shadow: 0 0 0 0px rgba(244, 67, 54, 0); }
        }
    </style>
</head>
<body>

<header>
    <h1>KITCHEN DISPLAY SYSTEM</h1>
    <div id="clock">00:00:00</div>
</header>

<div class="kds-grid" id="orderContainer">
    </div>

<script>
    // Sample Data
    const orders = [
        { id: 101, table: "T4", items: ["2x Cheese Burger", "1x Large Fries"], minutes: 2 },
        { id: 102, table: "T12", items: ["1x Margherita Pizza", "2x Coke"], minutes: 8 },
        { id: 103, table: "Pickup", items: ["1x Caesar Salad"], minutes: 12 }
    ];

    function renderOrders() {
        const container = document.getElementById('orderContainer');
        container.innerHTML = '';

        orders.forEach(order => {
            const urgencyClass = order.minutes >= 10 ? 'critical' : (order.minutes >= 5 ? 'warning' : '');
            
            const card = document.createElement('div');
            card.className = `order-card ${urgencyClass}`;
            card.innerHTML = `
                <div class="order-header">
                    <span>#${order.id} - <strong>${order.table}</strong></span>
                    <span>${order.minutes}m</span>
                </div>
                <div class="order-items">
                    ${order.items.map(item => `<div class="order-item">${item}</div>`).join('')}
                </div>
                <div class="order-footer">
                    <button class="btn-complete" onclick="removeOrder(${order.id})">BUMP ORDER</button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function removeOrder(id) {
        const idx = orders.findIndex(o => o.id === id);
        if (idx > -1) orders.splice(idx, 1);
        renderOrders();
    }

    // Update clock
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    renderOrders();
</script>
</body>
</html>
