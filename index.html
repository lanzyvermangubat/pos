<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAST FOOD KDS - PRO MONITOR</title>
    <style>
        :root { --line-color: #ffffff; }
        body { font-family: 'Arial Black', sans-serif; background: #000; color: #fff; margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; color: #000; padding: 10px 20px; font-size: 1.2rem;
            border-bottom: 4px solid #555; height: 60px; box-sizing: border-box; flex-shrink: 0;
        }

        .recall-btn {
            background: #000; color: #fff; border: 2px solid #000; padding: 5px 15px;
            font-size: 0.9rem; cursor: pointer; font-weight: bold;
        }
        .recall-btn:active { background: #444; }

        .kds-scroll-area {
            flex-grow: 1; overflow-y: auto; padding: 10px;
            box-sizing: border-box; display: grid; grid-template-columns: repeat(2, 1fr);
            grid-auto-rows: calc(50% - 15px); gap: 15px;
        }

        .slot { border: 4px solid var(--line-color); background: #000; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
        .slot-head { background: var(--line-color); color: #000; padding: 8px 15px; display: flex; justify-content: space-between; align-items: center; font-size: 1.5rem; }
        .slot-body { padding: 15px; flex-grow: 1; font-size: 1.6rem; overflow-y: auto; scrollbar-width: none; }
        .item-note { color: #ffff00; font-size: 1rem; border: 1px dashed #ffff00; padding: 5px; margin-top: 5px; display: block; }

        .slot-foot { background: #222; color: #fff; text-align: center; padding: 15px; cursor: pointer; font-size: 1.2rem; border-top: 2px solid var(--line-color); }
        .slot-foot:active { background: #fff; color: #000; }

        /* Prep Summary Bar */
        .summary-bar {
            background: #111; border-top: 4px solid #fff; padding: 10px 20px;
            display: flex; gap: 20px; overflow-x: auto; white-space: nowrap;
            height: 60px; align-items: center; flex-shrink: 0;
        }
        .summary-item { background: #fff; color: #000; padding: 5px 12px; border-radius: 4px; font-size: 1.1rem; font-weight: 900; }

        .urgent .slot-head { background: #ff0000; color: #fff; animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }

        .kds-scroll-area::-webkit-scrollbar { width: 15px; }
        .kds-scroll-area::-webkit-scrollbar-track { background: #222; }
        .kds-scroll-area::-webkit-scrollbar-thumb { background: #fff; }
    </style>
</head>
<body>

    <header>
        <div>ACTIVE: <span id="orderCount">0</span></div>
        <button class="recall-btn" id="recallBtn" onclick="window.recallLastOrder()" style="display:none;">↺ RECALL LAST</button>
        <div id="clock">00:00:00</div>
    </header>

    <div class="kds-scroll-area" id="kdsGrid"></div>

    <div class="summary-bar" id="summaryBar">
        <span style="color:#888; font-size:0.8rem;">TOTAL PREP:</span>
        </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, push, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4",
        authDomain: "pos-lovelyentclub.firebaseapp.com",
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com",
        projectId: "pos-lovelyentclub",
        storageBucket: "pos-lovelyentclub.firebasestorage.app",
        messagingSenderId: "271664805776",
        appId: "1:271664805776:web:38b2482645209cd7f56515"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let lastOrderPulled = null;

    // --- HEARTBEAT TIMER FUNCTION ---
    function tick() {
        const now = Date.now();
        const slots = document.querySelectorAll('.slot');
        const summaryBar = document.getElementById('summaryBar');
        const totals = {};

        slots.forEach(slot => {
            const timestamp = parseInt(slot.getAttribute('data-time'));
            const timerEl = slot.querySelector('.timer-display');
            
            // Update Timer Text
            const elapsed = Math.floor((now - timestamp) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = (elapsed % 60).toString().padStart(2, '0');
            timerEl.innerText = `${mins}:${secs}`;

            // Handle Urgency
            if (mins >= 3) slot.classList.add('urgent');
            else slot.classList.remove('urgent');

            // Gather Items for Summary while we are looping
            const items = JSON.parse(slot.getAttribute('data-items'));
            items.forEach(i => {
                const parts = i.split('x ');
                const qty = parseInt(parts[0]) || 1;
                const name = parts[1] || i;
                totals[name] = (totals[name] || 0) + qty;
            });
        });

        // Update Summary Bar
        const summaryContent = Object.keys(totals).map(name => 
            `<span class="summary-item">${totals[name]} ${name}</span>`
        ).join('');
        summaryBar.innerHTML = `<span style="color:#888; font-size:0.8rem;">TOTAL PREP:</span> ` + summaryContent;
    }

    onValue(ref(db, 'orders'), (snapshot) => {
        const grid = document.getElementById('kdsGrid');
        const countDisplay = document.getElementById('orderCount');
        const data = snapshot.val();
        grid.innerHTML = '';
        if (!data) { countDisplay.innerText = "0"; return; }
        
        const entries = Object.entries(data);
        countDisplay.innerText = entries.length;

        entries.forEach(([id, order]) => {
            const slot = document.createElement('div');
            slot.className = `slot`;
            slot.setAttribute('data-time', order.timestamp);
            slot.setAttribute('data-items', JSON.stringify(order.items));
            
            slot.innerHTML = `
                <div class="slot-head">
                    <span>${order.table}</span>
                    <span class="timer-display">0:00</span>
                </div>
                <div class="slot-body">
                    ${order.items.map(i => `<div>• ${i}</div>`).join('')}
                    ${order.note ? `<span class="item-note">NOTE: ${order.note}</span>` : ''}
                </div>
                <div class="slot-foot" onclick='window.bump("${id}", ${JSON.stringify(order)})'>CLEAR</div>
            `;
            grid.appendChild(slot);
        });
        tick(); // Immediate update on data change
    });

    window.bump = (id, order) => {
        const completedRef = ref(db, 'completedOrders');
        const newRef = push(completedRef);
        lastOrderPulled = { ...order, firebaseId: newRef.key };
        
        set(newRef, { ...order, completedAt: serverTimestamp() }).then(() => {
            remove(ref(db, `orders/${id}`));
            document.getElementById('recallBtn').style.display = 'block';
        });
    };

    window.recallLastOrder = () => {
        if (!lastOrderPulled) return;
        push(ref(db, 'orders'), {
            table: lastOrderPulled.table,
            items: lastOrderPulled.items,
            note: lastOrderPulled.note || "",
            timestamp: lastOrderPulled.timestamp
        }).then(() => {
            remove(ref(db, `completedOrders/${lastOrderPulled.firebaseId}`));
            lastOrderPulled = null;
            document.getElementById('recallBtn').style.display = 'none';
        });
    };

    // Intervals
    setInterval(tick, 1000); 
    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
