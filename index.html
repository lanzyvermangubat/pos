<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KDS - MONITOR</title>
    <style>
        :root { --bg: #000; --fg: #fff; --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { font-family: var(--font); background: var(--bg); color: var(--fg); margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; background: #fff; color: #000; padding: 10px 20px; border-bottom: 4px solid #555; height: 60px; box-sizing: border-box; }
        .recall-btn { background: #000; color: #fff; border: 2px solid #000; padding: 5px 15px; font-weight: bold; cursor: pointer; }
        .kds-scroll-area { flex-grow: 1; overflow-y: auto; padding: 10px; box-sizing: border-box; display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: calc(50% - 15px); gap: 15px; }
        .slot { border: 4px solid #fff; background: #000; display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
        .slot-head { background: #fff; color: #000; padding: 8px 15px; display: flex; justify-content: space-between; font-weight: 900; font-size: 1.5rem; }
        .slot-body { padding: 15px; flex-grow: 1; font-size: 1.6rem; font-weight: 600; overflow-y: auto; }
        .item-note { color: #ffff00; font-size: 1rem; border: 1px dashed #ffff00; padding: 5px; margin-top: 5px; display: block; }
        .slot-foot { background: #222; color: #fff; text-align: center; padding: 15px; cursor: pointer; font-size: 1.2rem; font-weight: bold; border-top: 2px solid #fff; }
        .summary-bar { background: #111; border-top: 4px solid #fff; padding: 10px 20px; display: flex; gap: 20px; overflow-x: auto; height: 60px; align-items: center; }
        .summary-item { background: #fff; color: #000; padding: 5px 12px; font-weight: 900; }
        .urgent .slot-head { background: #ff0000; color: #fff; animation: blinker 1s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <header><div>ACTIVE: <span id="orderCount">0</span></div><button class="recall-btn" id="recallBtn" onclick="window.recallLastOrder()" style="display:none;">↺ RECALL</button><div id="clock">00:00:00</div></header>
    <div class="kds-scroll-area" id="kdsGrid"></div>
    <div class="summary-bar" id="summaryBar"><span style="color:#888; font-size:0.8rem;">TOTAL PREP:</span></div>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, push, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";
    const firebaseConfig = { apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4", authDomain: "pos-lovelyentclub.firebaseapp.com", databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com", projectId: "pos-lovelyentclub", storageBucket: "pos-lovelyentclub.firebasestorage.app", messagingSenderId: "271664805776", appId: "1:271664805776:web:38b2482645209cd7f56515" };
    const app = initializeApp(firebaseConfig); const db = getDatabase(app); let lastOrderPulled = null;
    function tick() {
        const now = Date.now(); const slots = document.querySelectorAll('.slot'); const totals = {};
        slots.forEach(slot => {
            const timestamp = parseInt(slot.getAttribute('data-time')); const timerEl = slot.querySelector('.timer-display');
            const elapsed = Math.floor((now - timestamp) / 1000); const mins = Math.floor(elapsed / 60); const secs = (elapsed % 60).toString().padStart(2, '0');
            timerEl.innerText = `${mins}:${secs}`;
            if (mins >= 3) slot.classList.add('urgent'); else slot.classList.remove('urgent');
            const items = JSON.parse(slot.getAttribute('data-items'));
            items.forEach(i => { const qty = parseInt(i.split('x ')[0]) || 1; const name = i.split('x ')[1] || i; totals[name] = (totals[name] || 0) + qty; });
        });
        const summaryContent = Object.keys(totals).map(name => `<span class="summary-item">${totals[name]} ${name}</span>`).join('');
        document.getElementById('summaryBar').innerHTML = `<span style="color:#888; font-size:0.8rem;">TOTAL PREP:</span> ` + summaryContent;
    }
    onValue(ref(db, 'orders'), (snapshot) => {
        const grid = document.getElementById('kdsGrid'); const data = snapshot.val(); grid.innerHTML = ''; if (!data) { document.getElementById('orderCount').innerText = "0"; return; }
        document.getElementById('orderCount').innerText = Object.keys(data).length;
        Object.entries(data).forEach(([id, order]) => {
            const slot = document.createElement('div'); slot.className = `slot`; slot.setAttribute('data-time', order.timestamp); slot.setAttribute('data-items', JSON.stringify(order.items));
            slot.innerHTML = `<div class="slot-head"><span>${order.table}</span><span class="timer-display">0:00</span></div>
                <div class="slot-body">${order.items.map(i => `<div>• ${i}</div>`).join('')}${order.note ? `<span class="item-note">NOTE: ${order.note}</span>` : ''}</div>
                <div class="slot-foot" onclick='window.bump("${id}", ${JSON.stringify(order)})'>CLEAR</div>`;
            grid.appendChild(slot);
        });
        tick();
    });
    window.bump = (id, order) => {
        const completedRef = ref(db, 'completedOrders'); const historyRef = ref(db, 'history'); const newRef = push(completedRef); const finalizedData = { ...order, completedAt: Date.now() };
        lastOrderPulled = { ...order, firebaseId: newRef.key };
        set(newRef, finalizedData);
        push(historyRef, finalizedData).then(() => { remove(ref(db, `orders/${id}`)); document.getElementById('recallBtn').style.display = 'block'; });
    };
    window.recallLastOrder = () => { if (!lastOrderPulled) return; push(ref(db, 'orders'), { table: lastOrderPulled.table, items: lastOrderPulled.items, note: lastOrderPulled.note || "", timestamp: lastOrderPulled.timestamp }).then(() => { remove(ref(db, `completedOrders/${lastOrderPulled.firebaseId}`)); lastOrderPulled = null; document.getElementById('recallBtn').style.display = 'none'; }); };
    setInterval(tick, 1000); setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
