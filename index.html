<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STEALTH KDS - MONITOR</title>
    <style>
        :root { --bg: #000; --fg: #fff; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--fg); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { border-bottom: 2px solid var(--fg); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; background: #080808; }
        
        .layout { display: grid; grid-template-columns: 1fr 320px; flex: 1; overflow: hidden; }
        
        .kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; padding: 20px; overflow-y: auto; align-content: start; }
        .card { border: 1px solid var(--fg); background: var(--bg); display: flex; flex-direction: column; }
        .card-head { background: var(--fg); color: var(--bg); padding: 10px; font-weight: bold; display: flex; justify-content: space-between; }
        .card-body { padding: 15px; flex-grow: 1; font-size: 1.3rem; }
        .card-foot { border-top: 1px solid var(--fg); padding: 15px; text-align: center; cursor: pointer; font-weight: bold; font-size: 1.1rem; }
        .card-foot:active { background: var(--fg); color: var(--bg); }

        .sidebar { border-left: 2px solid var(--fg); background: #080808; padding: 20px; overflow-y: auto; }
        .sidebar-title { border-bottom: 2px solid var(--fg); padding-bottom: 10px; margin-bottom: 20px; font-weight: bold; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 1.1rem; }
        .count-badge { background: var(--fg); color: var(--bg); padding: 0 10px; font-weight: bold; }

        .critical { animation: pulse 1s infinite alternate; }
        @keyframes pulse { from { border-color: #fff; box-shadow: 0 0 0px #fff; } to { border-color: #ff0000; box-shadow: 0 0 10px #ff0000; } }
    </style>
</head>
<body>

    <header>
        <h1 style="margin:0; font-size:1.5rem; letter-spacing:4px;">KDS MONITOR</h1>
        <div id="clock">00:00:00</div>
    </header>

    <div class="layout">
        <div class="kds-grid" id="kdsGrid"></div>
        <div class="sidebar">
            <div class="sidebar-title">PRODUCTION TOTALS</div>
            <div id="prepTotals"></div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getDatabase, ref, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB1BND4Pd7vpd_8LJW1IwZB36-4uFdO6R4",
        authDomain: "pos-lovelyentclub.firebaseapp.com",
        databaseURL: "https://pos-lovelyentclub-default-rtdb.firebaseio.com",
        projectId: "pos-lovelyentclub",
        storageBucket: "pos-lovelyentclub.firebasestorage.app",
        messagingSenderId: "271664805776",
        appId: "1:271664805776:web:38b2482645209cd7f56515"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    onValue(ref(db, 'orders'), (snapshot) => {
        const grid = document.getElementById('kdsGrid');
        const prep = document.getElementById('prepTotals');
        const data = snapshot.val();
        
        grid.innerHTML = ''; prep.innerHTML = '';
        if (!data) return;

        const totals = {};

        Object.entries(data).forEach(([id, order]) => {
            const age = Math.floor((Date.now() - order.timestamp) / 60000);
            
            const card = document.createElement('div');
            card.className = `card ${age > 12 ? 'critical' : ''}`;
            card.innerHTML = `
                <div class="card-head"><span>${order.table}</span><span>${age}m</span></div>
                <div class="card-body">${order.items.map(i => `<div style="margin-bottom:5px;">${i}</div>`).join('')}</div>
                <div class="card-foot" onclick='window.bump("${id}", ${JSON.stringify(order)})'>BUMP TO SERVER</div>
            `;
            grid.appendChild(card);

            order.items.forEach(i => {
                const parts = i.split('x ');
                const qty = parseInt(parts[0]);
                const name = parts[1];
                totals[name] = (totals[name] || 0) + qty;
            });
        });

        Object.keys(totals).sort().forEach(item => {
            prep.innerHTML += `<div class="summary-row"><span>${item}</span><span class="count-badge">${totals[item]}</span></div>`;
        });
    });

    window.bump = (id, order) => {
        push(ref(db, 'completedOrders'), {...order, completedAt: Date.now()})
        .then(() => remove(ref(db, `orders/${id}`)));
    };

    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
</script>
</body>
</html>
